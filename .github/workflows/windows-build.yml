name: Windows portable app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build portable Windows app
        shell: pwsh
        run: ./packaging/Build-Windows.ps1
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: STFC-Advisor-Windows-x64
          path: dist/STFC-Advisor-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
